<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting…</title>
    <script>
      // Preserve the full path and redirect to /?p=...
      var path = location.pathname + location.search + location.hash;
      location.replace("/?p=" + encodeURIComponent(path));
    </script>
  </head>
  <body></body>
</html>
